reviews:
  - date: '2026-09-01'
    rating: 2
    summary: >-
      University-pipeline re-profile with the operator axis applied. The June 2026 profile credited
      Nagoya University with one surface, the NAGOYA Repository OAI-PMH endpoint, without settling
      who operates it. That endpoint is a TENANT deployment on the National Institute of
      Informatics' WEKO3 / JAIRO Cloud platform — the records, metadata and library administrators
      (adminEmail ir-admin@nul.nagoya-u.ac.jp) are Nagoya's, the software, host and contract are
      NII's — so it is now recorded as a tenant relationship and no WEKO3 spec is saved here. Two
      genuinely institution-operated machine surfaces were found that the June profile missed: a
      Shibboleth SAML 2.0 identity provider at shib.nagoya-u.ac.jp registered in GakuNin since
      2014-04-30, and the ERG Science Center's open Arase/ground-based data archive at ISEE, which
      SPEDAS and pySPEDAS read directly. ROR registration (04chrp450) and GakuNin federation
      membership are recorded as registry and federation facts. Still no developer portal, no
      OpenAPI, no API keys, no llms.txt and no security.txt; api./data./opendata./developer.
      subdomains do not resolve. github.com/NagoyaUniversity is NOT the institution — a 2017 shell
      with one forked repository — and is not credited. No fabricated endpoints or specs; the ERG
      archive and the OAI-PMH endpoint are both deliberately left uncontracted rather than given a
      generated spec.
    endpoints:
      - url: https://metadata.gakunin.nii.ac.jp/gakunin-metadata.xml
        status: 200
        note: GakuNin federation aggregate, 5,653,150 bytes, 650 entities; exactly one is Nagoya's IdP (PI0136JP).
