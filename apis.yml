  - aid: nagoya:ergsc-data-archive
    name: ERG Science Center data archive (ISEE, Nagoya University)
    x-operator: institution
    description: >-
      Open, machine-traversable HTTPS data archive operated by the ERG Science Center at Nagoya
      University's Institute for Space-Earth Environmental Research (ISEE, formerly STEL). It serves
      the Arase (ERG) satellite instrument data — att, hep, lepe, lepi, mepe, mepi, mgf, orb, pwe and
      xep — alongside ground-based observation data, guest datasets and the Conjunction Event Finder
      archive, in CDF. There is no OpenAPI and no REST contract: the interface is an Apache directory
      index over a stable path grammar, and it is consumed programmatically by the SPEDAS (IDL) and
      pySPEDAS (Python) analysis frameworks through the ERG plug-in, which resolves file paths
      against this host. The Conjunction Event Finder is a set of CGI services on the same host
      (/cef/geotail.cgi, /cef/cluster.cgi, /cef/akebono.cgi, /cef/reimei.cgi, /cef/tc1.cgi,
      /cef/tc2.cgi), moved to Nagoya from JAXA/ISAS DARTS in 2013. Verified live 2026-09-01: GET
      /data/ergsc/ returns 200 with a real index listing cef/, ground/, guest/ and satellite/, and
      GET /data/ergsc/satellite/erg/ returns 200 listing the ten instrument directories. No spec is
      generated for it — a directory tree is not a contract, and inventing one would be fabrication.
    humanURL: https://ergsc.isee.nagoya-u.ac.jp/
    baseURL: https://ergsc.isee.nagoya-u.ac.jp/data/ergsc/
    tags: [ Research Data, Open Data, Space Physics, CDF, Arase, SPEDAS, Satellite ]
    properties:
      - type: Documentation
        url: https://ergsc.isee.nagoya-u.ac.jp/data_info/howto.shtml.en
      - type: Website
        url: https://ergsc.isee.nagoya-u.ac.jp/
      - type: SourceCode
        url: https://github.com/spedas/pyspedas
  - aid: nagoya:repo-oai
    name: NAGOYA Repository OAI-PMH (NII WEKO3 / JAIRO Cloud tenant)
    x-operator: tenant
    description: >-
      OAI-PMH 2.0 metadata harvesting interface for the NAGOYA Repository, Nagoya University's
      institutional repository. Verified live 2026-09-01 — verb=Identify returns 200 text/xml with
      repositoryName "NAGOYA Repository", baseURL https://nagoya.repo.nii.ac.jp/oai, protocolVersion
      2.0, earliestDatestamp 2017-11-30T00:00:00Z, deletedRecord transient, granularity
      YYYY-MM-DDThh:mm:ssZ and adminEmail ir-admin@nul.nagoya-u.ac.jp (Nagoya University Library).
      verb=ListMetadataFormats returns seven prefixes — jpcoar_1.0, jpcoar, jpcoar_2.0, oai_dc, ddi,
      jpcoar_v1 and lom — i.e. the JPCOAR schema plus Dublin Core, DDI and LOM. verb=ListSets returns
      100 setSpecs per page mapping the university's own organisational units and journal series.
      nagoya.repo.nii.ac.jp is an institution-specific subdomain on the National Institute of
      Informatics' WEKO3 / JAIRO Cloud platform: the records, the metadata and the library staff are
      Nagoya's; the software, the host and the contract are NII's. Recorded here as a tenant
      relationship — a real institutional fact — rather than credited to Nagoya as its own
      engineering. No WEKO3 contract is saved under this institution, because it is a product
      contract identical across every JAIRO Cloud repository in Japan. Operational note: the endpoint
      returns 406 to a browser User-Agent and 200 to a default client.
    humanURL: https://nagoya.repo.nii.ac.jp/
    baseURL: https://nagoya.repo.nii.ac.jp/oai
    tags: [ Research Repository, OAI-PMH, JPCOAR, WEKO, Open Access, Tenant, Metadata ]
    properties:
      - type: Documentation
        url: https://nagoya.repo.nii.ac.jp/about
      - type: Conformance
        url: conformance/nagoya-conformance.yml
