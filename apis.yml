    name: ROR registration — Nagoya University
    x-operator: registry
    description: >-
      Nagoya University is registered in the Research Organization Registry as ROR ID
      https://ror.org/04chrp450, status active, established 1871, names "Nagoya University" /
      "名古屋大学" / "Nagoya Daigaku", website http://en.nagoya-u.ac.jp/, with cross-registered
      external identifiers GRID grid.27476.30, ISNI 0000 0001 0943 978X, Wikidata Q1191132 and
      Crossref Funder ID 501100004823. This is a membership in an identifier registry the institution
      is REGISTERED IN, not a contract it operates: the ROR API is ROR's and is not saved here. The
      entry is recorded because being a registered research organisation is a fact about Nagoya
      University. Verified 2026-09-01 against https://api.ror.org/v2/organizations/04chrp450 (200).
    humanURL: https://ror.org/04chrp450
    baseURL: https://api.ror.org/v2/organizations/04chrp450
