description: >-
  Nagoya University (名古屋大学) is a national research university in Nagoya, Aichi, Japan, founded
  1871, a member of Japan's Designated National University group and, since 2020, part of the Tokai
  National Higher Education and Research System (THERS) alongside Gifu University. It runs no
  developer portal, publishes no OpenAPI and issues no API keys, and this profile does not pretend
  otherwise. What it does operate, on its own nagoya-u.ac.jp hosts, are two genuinely
  institution-run machine surfaces: a Shibboleth SAML 2.0 identity provider
  (https://shib.nagoya-u.ac.jp/idp/shibboleth) registered in GakuNin, Japan's academic access
  management federation, since 2014; and the ERG Science Center at the Institute for Space-Earth
  Environmental Research, which serves the Arase (ERG) satellite and ground-based observation data
  archive as an open, machine-traversable HTTPS tree that the pySPEDAS and SPEDAS analysis clients
  read directly. Its institutional repository, NAGOYA Repository, is a TENANT deployment on the
  National Institute of Informatics' WEKO3 / JAIRO Cloud platform: the content, the metadata and the
  library administrators are Nagoya's, but the OAI-PMH endpoint and its contract are NII's and are
  not credited here. The university is registered in ROR (04chrp450) but is a member of neither
  DataCite nor Crossref — Japanese repositories mint DOIs through JaLC. Student records, course
  registration, the NU Portal and campus IT all sit behind THERS/GakuNin authentication and are not
  publicly documented developer APIs. Several relevant surfaces, including the university's own
  GakuNin service documentation, exist only in Japanese.
