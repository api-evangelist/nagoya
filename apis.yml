  - aid: nagoya:gakunin-federation
    name: GakuNin academic access management federation membership
    x-operator: federation
    description: >-
      Nagoya University is a participating institution in GakuNin (学術認証フェデレーション), the
      Japanese national academic access management federation operated by the National Institute of
      Informatics, and states so on its own site. Through it the university's THERS account
      authenticates against federated services including GakuNin mAP (cg.gakunin.jp), meatmail,
      GakuNin RDM (rdm.nii.ac.jp), GakuNin LMS (lms.nii.ac.jp), mdx, Q-leap LMS, Nature Research,
      SpringerLink, Atypon and Westlaw. A federation is shared by definition and the IdP behind it is
      the institution's, so this membership is recorded rather than treated as a shared-host
      misattribution. The federation's signed metadata aggregate is the machine-readable artifact;
      it belongs to GakuNin and is not saved here. Note that the university's own documentation of
      this service exists only on the Japanese surface — the English equivalent returns 404.
    humanURL: https://www.gakunin.jp/en/
    baseURL: https://metadata.gakunin.nii.ac.jp/gakunin-metadata.xml
    tags: [ Identity Federation, SAML, Shibboleth, GakuNin, Japan, Membership ]
    properties:
      - type: Documentation
        url: https://icts.nagoya-u.ac.jp/ja/services/gakunin/
      - type: Conformance
        url: conformance/nagoya-conformance.yml
