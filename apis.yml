x-coverage:
  state: covered
  reason: no_public_api
  detail: >-
    Every reachable surface was probed on 2026-09-01 and two institution-operated machine surfaces
    were found and verified — a Shibboleth SAML 2.0 identity provider published in the GakuNin
    federation aggregate, and the ERG Science Center's open Arase/ground-based data archive at ISEE —
    plus three education-regime domain standards evidenced from public endpoints (shibboleth, saml,
    oai-pmh). The profile stays thin because Nagoya University operates no public API: no developer
    portal, no OpenAPI, no API keys, no OAuth, and no llms.txt or security.txt. api., data.,
    opendata. and developer.nagoya-u.ac.jp do not resolve. The NAGOYA Repository OAI-PMH endpoint is
    recorded as a TENANT relationship on NII's WEKO3 / JAIRO Cloud rather than as Nagoya's contract,
    and no WEKO3 spec has been generated to stand in for one — that product contract is identical
    across every JAIRO Cloud repository in Japan and belongs in NII's own repo. The ERG archive is
    left uncontracted for the same no-fabrication reason: it is an Apache directory tree consumed by
    SPEDAS/pySPEDAS, not a REST API. github.com/NagoyaUniversity exists but is not the institution —
    it is a 2017 shell with one forked repo and no name, description or verification, and is not
    credited. Student records, course registration and the NU Portal are behind THERS/GakuNin SSO.
    Two access notes: the OAI-PMH endpoint 406s a browser User-Agent and 200s a default client, and
    the university's own GakuNin documentation exists only in Japanese (the English path 404s).
